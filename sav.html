<script>

#....############..##########.....###################.....#"]];

function sq(k){var n=Date.now();if(n-QL>900)Q='';QL=n;Q=Q.slice(-2)+k;var f=['LLF','RRF','JJF'].indexOf(Q)+1;if(f)FM=FM==f?0:f;}
function g(x){var y=spawn.y-20;if(rectSolid(x,y,13,20))return 0;for(var c=x/TW|0;c<=(x+13)/TW;c++)if(grid[8][c]==='^')return 0;for(var i=0,f;f=foes[i];i++)if(x<f.x+16&&x+13>f.x&&y<f.y+14&&y+20>f.y)return 0;return 1;}
function z(){for(var d=0;d<12;d++){if(g(spawn.x+d*TW))return spawn.x+=d*TW;if(g(spawn.x-d*TW))return spawn.x-=d*TW;}}
function beep(f,d,ty,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),v=AC.createGain();o.type=ty||'square';o.frequency.value=f;v.gain.value=g||.04;o.connect(v);v.connect(AC.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
var CRET=[{n:'Cinderkit',t:0,hp:36,a:4,d:2,s:4,X:['FIRST FLARE','First attack each battle hits +50%.'],mv:[['Spark Nip',8,0],['Cinder Rush',12,0],['Ash Veil',10,1],['Flare Burst',18,0]]},{n:'Pebblit',t:1,hp:44,a:3,d:5,s:1,X:['STONE SKIN','Takes 1 less damage (min 1).'],mv:[['Rock Tap',8,1],['Stone Slam',13,1],['Dust Guard',9,2],['Quake Hit',17,1]]},{n:'Bloomimp',t:2,hp:34,a:3,d:3,s:3,X:['BLOOM DRAIN','Heals 3 HP after it attacks.'],mv:[['Petal Cut',9,2],['Vine Lash',12,2],['Spore Puff',10,3],['Bloom Burst',17,2]]},{n:'Galewing',t:3,hp:32,a:4,d:2,s:5,X:['TAILWIND','20% chance to strike twice.'],mv:[['Gust Peck',9,3],['Wind Dash',12,3],['Feather Fan',10,0],['Storm Dive',18,3]]}];

function pips(n){return '●'.repeat(n)+'○'.repeat(5-n);}
function cardHtml(c,lv){return '<b>'+c.n+'</b> Lv'+lv+' · '+CTYP[c.t]+'<br>ATK '+pips(c.a)+'<br>DEF '+pips(c.d)+'<br>SPD '+pips(c.s)+'<br><span style="color:#ffe95a">★ '+c.X[0]+'</span><br>'+c.X[1];}
var CARDS_KEY='vanix_cards_v1';
function cardsGet(){try{return JSON.parse(localStorage.getItem(CARDS_KEY))||[];}catch(e){return[];}}
function cardsAdd(n){var l=cardsGet();if(l.indexOf(n)<0){l.push(n);try{localStorage.setItem(CARDS_KEY,JSON.stringify(l));}catch(e){}}}
var CAUGHT_KEY='vanix_cards_caught_v1';
function caughtGet(){try{return JSON.parse(localStorage.getItem(CAUGHT_KEY))||[];}catch(e){return[];}}
function caughtAdd(n){var l=caughtGet();if(l.indexOf(n)<0){l.push(n);try{localStorage.setItem(CAUGHT_KEY,JSON.stringify(l));}catch(e){}}}
function showCards(){var g=cardsGet(),cg=caughtGet(),h='<b style="font-size:14px">CARD COLLECTION</b><br><br>'+cardHtml(COMP,5)+' <span style="color:#888">(YOUR COMPANION)</span><hr>';for(var i=0;i<CRET.length;i++){var c=CRET[i];h+=cg.indexOf(c.n)>=0?cardHtml(c,4)+' (CAUGHT)':(g.indexOf(c.n)>=0?cardHtml(c,4)+' (BEATEN)':'???<br>NOT BEATEN YET');h+='<hr>';}$('covp').innerHTML=h;$('cov').style.display='block';}
function hideCards(){$('cov').style.display='none';}
var wcardT=null;
function wcardShow(w){var c=CRET[w.k];$('wct').innerHTML=cardHtml(c,4);var x=$('wcc').getContext('2d');x.clearRect(0,0,40,36);x.fillStyle=COL[w.k];x.beginPath();x.ellipse(20,22,12,9,0,0,7);x.fill();x.fillStyle='#111';x.fillRect(15,18,3,3);x.fillRect(23,18,3,3);$('wcard').style.display='block';if(wcardT)clearTimeout(wcardT);wcardT=setTimeout(function(){$('wcard').style.display='none';},2600);}
function spawnWild(){var dx=P.dir||1,cx=Math.floor((P.x+P.w/2+dx*(200+Math.random()*120))/TW);if(cx<2)cx=2;if(cx>COLS-3)cx=COLS-3;if(Math.abs(cx*TW+12-flagX)<48)return;var k=Math.floor(Math.random()*4);for(var r=ROWS-1;r>=0;r--){if(solidAt(cx,r)&&!solidAt(cx,r-1)&&(r===0||grid[r-1][cx]!=='^')){var hp=Math.ceil(CRET[k].hp/10)+(CRET[k].d>=4?1:0);var nw={x:cx*TW+2,y:r*TW-18,w:20,h:18,vx:0,hp:hp,max:hp,k:k,t:CRET[k].t,a:CRET[k].a,d:CRET[k].d,s:CRET[k].s,sp:0.5+0.1*CRET[k].s,ph:0,dead:false};wilds.push(nw);wcardShow(nw);beep(520,.06);return;}}}
function buildGrid(rows){
COLS=Math.max.apply(null,rows.map(function(r){return r.length;}));
grid=[];coins=[];foes=[];picks=[];bumps=[];shots=[];wilds=[];wildT=15000+Math.random()*15000;flagX=0;
for(var r=0;r<ROWS;r++){var row=rows[r],gr=[];for(var c=0;c<COLS;c++){var ch=row[c]||'.';gr.push(ch);
if(ch==='o')coins.push({x:c*TW+12,y:r*TW+12,got:false});
if(ch==='w')foes.push({x:c*TW+4,y:r*TW+8,w:16,h:14,vx:-.6,spike:false,dead:false,ph:0});
if(ch==='s')foes.push({x:c*TW+4,y:r*TW+8,w:16,h:14,vx:-1.1,spike:true,dead:false,ph:0});
if(ch==='S')spawn={x:c*TW+12,y:r*TW+12};
if(ch==='F')flagX=c*TW+12;
}grid.push(gr);}
}
function loadLevel(n){level=n;buildGrid(LEVELS[n]);coinN=0;invT=0;resetP();tongueT=0;if(pet){if(!spawn){pet=false;riding=false;gulp=null;hatchT=0;}else{petX=spawn.x+20;petY=spawn.y-20;petVX=0;petVY=0;petGrounded=false;petCd=0;for(var k=0;k<4&&rectSolid(petX,petY,26,20);k++)petY-=TW;if(riding){P.x=petX+6;P.y=petY-P.h+6;}}}hud();}
function buildBonus(){buildGrid(BONUS);flagX=1e9;spawn={x:2*TW+12,y:8*TW+12};resetP();hud();}
function resetP(){P={x:spawn.x,y:spawn.y-20,w:13,h:20,vx:0,vy:0,dir:1,grounded:false,big:false,dead:false};starT=0;shots=[];}
function solidAt(c,r){if(c<0||c>=COLS)return true;if(r<0||r>=ROWS)return false;var ch=grid[r][c];return ch==='#'||ch==='B'||ch==='?'||ch==='Q'||ch==='T'||ch==='P'||ch==='!'||ch==='*'||ch==='U';}
function rectSolid(x,y,w,h){var x0=Math.floor(x/TW),x1=Math.floor((x+w-.01)/TW),y0=Math.floor(y/TW),y1=Math.floor((y+h-.01)/TW);for(var r=y0;r<=y1;r++)for(var c=x0;c<=x1;c++)if(solidAt(c,r))return{c:c,r:r};return null;}
function showOv(t,p,b){$('ovt').innerHTML=t;$('ovp').innerHTML=p;$('st').textContent=b;$('ov').style.display='flex';}
function hideOv(){$('ov').style.display='none';}
function fmtTime(){var s=Math.floor(timeMs/1000);return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function hud(){$('sc').textContent=score;$('cn').textContent=coinN;$('lv').textContent=level+1;$('lf').textContent=Math.max(0,lives);$('tm').textContent=fmtTime();$('pw').textContent=FM?CRET[FM-1].n:riding?'🦖 RIDE':(pet?'🦖 PET':(starT>0?'★ STAR':(P&&P.big?'GOLD MASK':'')));}
function startGame(){score=0;lives=3;timeMs=0;FM=0;bonus=false;pet=false;riding=false;gulp=null;hatchT=0;tongueT=0;petCd=0;loadLevel(0);state='play';paused=false;hideOv();hideCards();beep(440,.05);}
function nextLevel(){if(level+1<LEVELS.length){loadLevel(level+1);state='play';hideOv();}else{state='win';showOv('YOU WIN!','ALL LEVELS CLEAR<br>SCORE '+score+'<br>TIME '+fmtTime(),'↻ PLAY AGAIN');}}
$('st').addEventListener('click',function(){if(state==='play'&&paused){paused=false;hideOv();}else if(state==='clear')nextLevel();else startGame();});
$('wcard').addEventListener('click',function(){$('wcard').style.display='none';});
document.addEventListener('visibilitychange',function(){if(document.hidden){keys={};if(state==='play'&&!paused){paused=AP=true;showOv('PAUSED','TAP ▶ TO KEEP RUNNING','▶ RESUME');}}else if(AP){paused=AP=false;jbuf=0;last=0;hideOv();}});
function bindHold(el,on,off){function dn(e){e.preventDefault();on();}function up(e){e.preventDefault();off();}el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')up(e);});el.addEventListener('touchstart',function(e){e.preventDefault();on();},{passive:false});el.addEventListener('touchend',function(e){e.preventDefault();off();},{passive:false});el.addEventListener('touchcancel',function(e){off();},{passive:false});}
bindHold($('bl'),function(){keys.l||sq('L'),keys.l=true;},function(){keys.l=false;});
bindHold($('br'),function(){keys.r||sq('R'),keys.r=true;},function(){keys.r=false;});
bindHold($('bj'),function(){keys.j||sq('J'),keys.j=true,jbuf=100;},function(){keys.j=false;});
$('bf').addEventListener('pointerdown',function(e){e.preventDefault();sq('F');shoot();});
$('bf').addEventListener('touchstart',function(e){e.preventDefault();shoot();},{passive:false});
$('bd').addEventListener('pointerdown',function(e){e.preventDefault();if(riding)dismount();else tryWarp();});
$('bd').addEventListener('touchstart',function(e){e.preventDefault();if(riding)dismount();else tryWarp();},{passive:false});if('ontouchstart'in window||navigator.maxTouchPoints>0)document.body.classList.add('pad-touch');
document.addEventListener('keydown',function(e){

if(e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='Space')e.preventDefault();
if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyW'){if(state!=='play'){if(state==='clear')nextLevel();else startGame();return;}keys.j||sq('J'),keys.j=true,jbuf=100;}
if(e.code==='ArrowDown'||e.code==='KeyS'){if(state==='play'){if(riding)dismount();else tryWarp();}}
if(e.code==='KeyF'||e.code==='KeyX'){if(state==='play'){e.repeat||sq('F');shoot();}}
if(e.code==='KeyP'&&state==='play'){paused=!paused;if(paused)showOv('PAUSED','PRESS P TO KEEP RUNNING','▶ RESUME');else hideOv();return;}
if(e.code==='ArrowLeft'||e.code==='KeyA'){keys.l||sq('L');keys.l=true;}
if(e.code==='ArrowRight'||e.code==='KeyD'){keys.r||sq('R');keys.r=true;}
});
document.addEventListener('keyup',function(e){if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=false;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){keys.j=false;if(P.vy<-3)P.vy=-3;}});
function hurt(){if(invT>0||state!=='play'||starT>0)return;if(FM){FM=0;invT=1500;return hud();}if(P.big){P.big=false;P.h=20;invT=1500;beep(200,.15,'sawtooth',.06);return;}lives--;beep(140,.25,'sawtooth',.08);hud();if(lives<=0){pet=false;riding=false;gulp=null;hatchT=0;tongueT=0;state='over';showOv('GAME OVER','SCORE '+score+'<br>MOLECULES '+coinN,'↻ TRY AGAIN');}else{pet=false;riding=false;gulp=null;hatchT=0;tongueT=0;resetP();loadFoes();}}
function loadFoes(){wilds=[];if(bonus){foes=[];return;}var rows=LEVELS[level];foes=[];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var ch=(rows[r]||'')[c];if(ch==='w')foes.push({x:c*TW+4,y:r*TW+8,w:16,h:14,vx:-.6,spike:false,dead:false,ph:0});if(ch==='s')foes.push({x:c*TW+4,y:r*TW+8,w:16,h:14,vx:-1.1,spike:true,dead:false,ph:0});}}
function bump(c,r){var ch=grid[r][c];if(ch==='?'||ch==='Q'||ch==='!'||ch==='*'||ch==='U'){grid[r][c]='B';bumps.push({c:c,r:r,t:150});if(ch==='?'){score+=100;coinN++;beep(1320,.07);}else{var k=ch==='Q'?'M':(ch==='!'?'P':(ch==='*'?'S':'U'));picks.push({x:c*TW+12,y:r*TW-6,vy:-1.5,kind:k,dead:false});beep(980,.08);}}
else if(ch==='B'){if(P.big){grid[r][c]='.';score+=50;beep(300,.08);}else{bumps.push({c:c,r:r,t:150});beep(180,.05);}}}
function mouthPos(){var d=P?P.dir:1;if(riding)return{x:P.x+P.w/2+d*10,y:P.y+8};return{x:petX+13+d*13,y:petY+8};}

picks.forEach(function(pk){if(pk.dead)return;if(pk.kind==='P'){ctx.fillStyle='#2fae5f';ctx.beginPath();ctx.ellipse(pk.x,pk.y,7,9,0,0,7);ctx.fill();ctx.fillStyle='#fff8e0';ctx.beginPath();ctx.ellipse(pk.x,pk.y-2,5,6,0,0,7);ctx.fill();ctx.strokeStyle='#1c1c22';ctx.beginPath();ctx.moveTo(pk.x-6,pk.y+2);ctx.lineTo(pk.x-2,pk.y-1);ctx.lineTo(pk.x+2,pk.y+3);ctx.lineTo(pk.x+6,pk.y);ctx.stroke();}else if(pk.kind==='S'){ctx.fillStyle='#ffe95a';ctx.beginPath();for(var k=0;k<10;k++){var a=-Math.PI/2+k*Math.PI/5,rr=k%2?3:8;ctx.lineTo(pk.x+Math.cos(a)*rr,pk.y+Math.sin(a)*rr);}ctx.closePath();ctx.fill();}else if(pk.kind==='U'){ctx.fillStyle='#1e8a3a';ctx.fillRect(pk.x-7,pk.y-7,14,14);ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';ctx.fillText('1UP',pk.x,pk.y+3);}else{ctx.fillStyle='#111';ctx.fillRect(pk.x-7,pk.y-7,14,14);ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.moveTo(pk.x-4,pk.y-6);ctx.lineTo(pk.x+4,pk.y-6);ctx.lineTo(pk.x,pk.y+6);ctx.closePath();ctx.fill();ctx.fillStyle='#ffcc33';ctx.fillRect(pk.x-3,pk.y-2,2,2);ctx.fillRect(pk.x+1,pk.y-2,2,2);}});
shots.forEach(function(sh){if(sh.dead)return;ctx.fillStyle='#39d353';ctx.beginPath();ctx.arc(sh.x,sh.y,4,0,7);ctx.fill();ctx.fillStyle='#d0ffb0';ctx.beginPath();ctx.arc(sh.x,sh.y,2,0,7);ctx.fill();});
foes.forEach(function(f){if(f.dead)return;var bob=Math.sin(f.ph/160)*1.5;
if(f.spike){ctx.fillStyle='#8a8f9e';ctx.beginPath();for(var k=0;k<8;k++){var a=k*Math.PI/4;ctx.moveTo(f.x+8+Math.cos(a)*7,f.y+7+Math.sin(a)*7);ctx.lineTo(f.x+8+Math.cos(a)*11,f.y+7+Math.sin(a)*11);}ctx.fill();ctx.fillStyle='#3a3f4a';ctx.beginPath();ctx.arc(f.x+8,f.y+7,7,0,7);ctx.fill();}
else{ctx.fillStyle='#1c1c24';ctx.fillRect(f.x,f.y+2+bob,16,12);ctx.fillStyle='#1c1c24';var fo=(f.ph/160|0)%2;ctx.fillRect(f.x+2+(fo?2:0),f.y+13,5,3);ctx.fillRect(f.x+9-(fo?2:0),f.y+13,5,3);}
ctx.fillStyle='#ff2a2a';ctx.fillRect(f.x+4,f.y+5+bob,3,3);ctx.fillRect(f.x+9,f.y+5+bob,3,3);});
wilds.forEach(function(w){if(w.dead)return;var col=COL[w.k];ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(w.x+10,w.y+10,10,8,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(w.x+5,w.y+6,3,3);ctx.fillRect(w.x+12,w.y+6,3,3);ctx.fillStyle='#fff';ctx.fillRect(w.x+6,w.y+7,1,1);ctx.fillRect(w.x+13,w.y+7,1,1);ctx.fillStyle='#222';ctx.fillRect(w.x+2,w.y-4,16,3);ctx.fillStyle='#39d353';ctx.fillRect(w.x+2,w.y-4,16*w.hp/w.max,3);});
drawPet();drawPlayer();
if(tongueT>0&&pet){var mp=mouthPos();ctx.strokeStyle='#ff6fa5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(mp.x,mp.y);ctx.lineTo(tongueX,mp.y);ctx.stroke();}
ctx.restore();
if(flashT>0){ctx.fillStyle='rgba(0,0,0,'+Math.min(.9,flashT/200)+')';ctx.fillRect(0,0,W,H);}
}
var last=0;
function loop(t){var dt=Math.min(50,t-last||16);last=t;
if(flashT>0)flashT-=dt;
if(state==='play'&&!paused)update(dt);
var bd=$('bd');if(bd)bd.style.visibility=(state==='play'&&(nearPipe()||riding))?'visible':'hidden';
draw();requestAnimationFrame(loop);}
loadLevel(0);requestAnimationFrame(loop);

(function(){try{
function contentH(){var m=0;var cs=document.body?document.body.children:[];for(var i=0;i<cs.length;i++){var el=cs[i];if(!el||el.tagName==='SCRIPT'||el.tagName==='STYLE')continue;var st=null;try{st=getComputedStyle(el);}catch(e){}if(st&&st.position==='fixed')continue;var r=null;try{r=el.getBoundingClientRect();}catch(e){}if(r){var b=r.bottom+(window.scrollY||0);if(b>m)m=b;}}return Math.ceil(m)+12;}
