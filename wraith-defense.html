/* WRAITH DEFENSE — original tower defense. No borrowed characters, art, music or names. */

   and 28px clear of any other unit, and 16px inside the canvas edge. */
function distToSeg(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy,t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function onPath(x,y){for(var i=0;i<PATH.length-1;i++)if(distToSeg(x,y,PATH[i][0],PATH[i][1],PATH[i+1][0],PATH[i+1][1])<28)return true;return false;}
function spotFree(S,x,y){if(!S||!isFinite(x)||!isFinite(y)||x<16||x>W-16||y<16||y>H-16)return false;if(onPath(x,y))return false;var i;for(i=0;i<S.towers.length;i++)if(Math.hypot(S.towers[i].x-x,S.towers[i].y-y)<28)return false;for(i=0;i<S.heroes.length;i++)if(Math.hypot(S.heroes[i].x-x,S.heroes[i].y-y)<28)return false;return true;}

swift:{hp:18,sp:1.05,rw:5,r:7,col:'#ffd94d'},

function lb(){try{return parseInt(localStorage.getItem('wraith_defense_best'))||0}catch(e){return 0}}
function sb(v){try{localStorage.setItem('wraith_defense_best',String(v))}catch(e){}}
function endUnlocked(){try{return localStorage.getItem('wraith_defense_endless')==='1';}catch(e){return false;}}
function unlockEnd(){try{localStorage.setItem('wraith_defense_endless','1');}catch(e){}}
function synOn(S){return!!(S&&S.heroes.some(function(h){return h.id===0;})&&S.heroes.some(function(h){return h.id===1;}));}
function waveComp(n){
  var count=6+2*n,hpM=1+0.22*(n-1),spM=Math.min(1.3,1+0.025*(n-1)),out=[];
  if(n>=4&&n<=6)hpM+=0.08*(n-3);
  if(n>=7){count+=2*(n-6);hpM=2.34+0.55*(n-6);spM=Math.min(1.5,1+0.025*(n-1)+0.045*(n-6));}
  if(n>12&&n<=16){count=42+2*(n-12);hpM=5.64+0.25*(n-12);spM=1.5;}
  if(n>16){count=50+9*(n-16);hpM=6.64+1.9*(n-16);spM=1.5;}  for(var i=0;i<count;i++){
    var t=(n>=4&&((n>=9&&i%4===3)||(n<9&&i%5===4)))?'tank':(i%3===2?'grunt':'swift'),b=ETYPES[t];
    out.push({type:t,hp:Math.round(b.hp*hpM),sp:b.sp*spM,rw:b.rw,r:b.r,col:b.col});
  }
  return out;
}
function waveStats(n){var c=waveComp(n),h=0,i;for(i=0;i<c.length;i++)h+=c[i].hp;return{count:c.length,totalHp:h};}
function mkEnemy(spec){
  return{x:PATH[0][0],y:PATH[0][1],wp:1,hp:spec.hp,mx:spec.hp,sp:spec.sp,rw:spec.rw,r:spec.r,col:spec.col,type:spec.type,dist:0,slowT:0,locked:false,ccLock:0};
}
function createGame(){
  return{coins:150,lives:10,wave:0,score:0,best:lb(),phase:'menu',towers:[],heroes:[],deck:[],lt:null,endless:false,enemies:[],shots:[],queue:[],spawnT:0,over:false,win:false,pz:false,ap:false,msg:'',msgT:0,tick:0,talentQueue:[],sgWd:0,sgAn:45,sgPw:60,sgSel:'std',sgWp:{split:2,rain:2,drill:2,pierce:2,quake:2},sgPjs:[],sgBr:24,sgAim:false,sgQk:0};
}
/* SIEGE CANNON — folded in from Wraith Siege (turn-based artillery).
   Drag to aim from the cannon (left edge), wind bends every shell.
   STD unlimited; SPLIT/RAIN/DRILL/PIERCE/QUAKE 2 uses per wave each.
   Blast radius grows +4 per wave, max 44 (Siege's escalation). */
var SG_G=0.5,SG_MZ={x:20,y:135},SG_WP={std:{n:'STD'},split:{n:'SPLIT'},rain:{n:'RAIN'},drill:{n:'DRILL'},pierce:{n:'PIERCE'},quake:{n:'QUAKE'}};
function sgProf(S,kd){if(kd==='sub')return{rad:Math.max(12,S.sgBr-8),dmg:1,outer:0,cap:0};if(kd==='drill')return{rad:S.sgBr+10,dmg:2,outer:1,cap:1};if(kd==='quake')return{rad:S.sgBr+12,dmg:1,outer:0,cap:1};return null;}
function sgFire(S){if(!S||S.over||S.pz||(S.phase!=='build'&&S.phase!=='wave'))return false;var kd=S.sgSel||'std';if(kd!=='std'){if(!(S.sgWp[kd]>0)){S.msg='OUT OF '+SG_WP[kd].n+'S!';S.msgT=50;return false;}S.sgWp[kd]--;}var a=S.sgAn*Math.PI/180,v=9+S.sgPw*0.08;var sh={x:SG_MZ.x,y:SG_MZ.y,vx:Math.cos(a)*v,vy:-Math.sin(a)*v,kind:kd,hit:{}};if(kd==='rain')sh.kind='rain';else if(kd==='split')sh.kind='split';S.sgPjs.push(sh);return true;}
function sgBlast(S,x,y,pf){pf=pf||{};var rad=pf.rad||S.sgBr,dm=pf.dmg||2,ou=pf.outer===undefined?1:pf.outer;for(var i=S.enemies.length-1;i>=0;i--){var e=S.enemies[i],d=Math.hypot(e.x-x,e.y-y);if(d<rad)e.hp-=dm;else if(ou&&d<rad+12)e.hp-=ou;else continue;if(e.hp<=0){awardKill(S,e);S.enemies.splice(i,1);}}}
function sgStep(S){if(!S||S.over||S.pz)return;if(S.sgQk>0)S.sgQk--;var al=[],i,p;for(i=0;i<S.sgPjs.length;i++){p=S.sgPjs[i];if(p.buried){if(--p.fuse<=0){sgBlast(S,p.x,p.y,sgProf(S,'drill'));}else al.push(p);continue;}p.vy+=SG_G;p.vx+=S.sgWd*0.02;p.x+=p.vx;p.y+=p.vy;if(p.kind==='split'&&!p.sp&&p.vy>=0){p.sp=true;var k;for(k=-1;k<=1;k++)al.push({x:p.x,y:p.y,vx:p.vx+k*2.2,vy:p.vy,kind:'sub',hit:{}});continue;}if(p.kind==='rain'&&!p.rn&&p.vy>=0){p.rn=true;var offs=[0,-2,2,-4,4],j;for(j=0;j<offs.length;j++)al.push({x:p.x,y:p.y,vx:p.vx+offs[j],vy:p.vy,kind:'sub',hit:{}});continue;}var hitE=null,hitI=-1;for(var ei=0;ei<S.enemies.length;ei++){var e=S.enemies[ei];if(Math.hypot(e.x-p.x,e.y-p.y)<e.r+4){hitE=e;hitI=ei;break;}}if(hitE&&p.kind==='pierce'){if(!p.hit[hitI]){p.hit[hitI]=1;hitE.hp-=1;if(hitE.hp<=0){var ki=S.enemies.indexOf(hitE);if(ki>=0){awardKill(S,hitE);S.enemies.splice(ki,1);}}}al.push(p);continue;}if(hitE||p.y>=H||p.x<-20||p.x>W+20||p.y>H+20){var lx=p.x,ly=Math.min(p.y,H);if(p.kind==='drill'&&hitE){p.buried=true;p.fuse=20;p.x=lx;p.y=ly;al.push(p);continue;}if(p.kind==='quake')S.sgQk=18;if(p.y<H+20||hitE)sgBlast(S,lx,ly,sgProf(S,p.kind));continue;}al.push(p);}S.sgPjs=al;}
function tDmg(t){return Math.round(TOWERS[t.type].dmg*(1+0.6*(t.lvl-1)));}
function tRange(t){return TOWERS[t.type].range+8*(t.lvl-1);}
function tCd(t){return Math.max(12,TOWERS[t.type].cd-4*(t.lvl-1)-(t.type===0?6*(t.pb||0):0));}
function upCost(t){return t.lvl>=3?0:Math.round(TOWERS[t.type].cost*0.8*t.lvl);}
function heroDmg(h){return Math.round(HEROES[h.id].dmg*(1+0.12*(h.lvl-1))*(1+0.15*talentCount(h,'rng')));}
function heroRange(h){return HEROES[h.id].range+4*(h.lvl-1)+25*talentCount(h,'rng');}
function heroCd(h){return Math.max(14,Math.round((HEROES[h.id].cd-2*(h.lvl-1))*Math.pow(0.75,talentCount(h,'cd'))));}
function abilityCd(h){if(h.id===1)return Math.max(180,360-20*(h.lvl-1));return Math.max(300,420-20*(h.lvl-1));}
function heroGainXp(S,n,h){if(!S)return;var list=h?[h]:S.heroes;for(var i=0;i<list.length;i++){var hh=list[i];if(!hh)continue;var before=hh.lvl;hh.xp+=n;while(hh.lvl<10&&hh.xp>=HERO_XP[hh.lvl])hh.lvl++;if(hh.lvl>before){if(!S.talentQueue)S.talentQueue=[];for(var u=before;u<hh.lvl;u++)S.talentQueue.push(hh);}}}
function talentCount(h,k){if(!h||!h.talents)return 0;var n=0;for(var i=0;i<h.talents.length;i++)if(h.talents[i]===k)n++;return n;}
function applyTalent(S,h,k){if(!S||!h||!h.talents)return false;var ok=TALENTS[h.id].some(function(t){return t.k===k;});if(!ok)return false;h.talents.push(k);var qi=S.talentQueue?S.talentQueue.indexOf(h):-1;if(qi>=0)S.talentQueue.splice(qi,1);return true;}
function pathCost(t,p){var tier=p==='A'?t.pa:t.pb;if(tier>=3)return 0;return Math.round(TOWERS[t.type].cost*(0.6+0.5*tier));}

    else if(hh.id===11){F('#1c1c28');C(hh.x,hh.y-2,10);F('#e0d6b8');C(hh.x-4,hh.y-4,1);C(hh.x+4,hh.y-4,1);ctx.strokeStyle='#e0d6b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hh.x-8,hh.y-8);ctx.lineTo(hh.x-13,hh.y-16);ctx.moveTo(hh.x+8,hh.y-8);ctx.lineTo(hh.x+13,hh.y-16);ctx.moveTo(hh.x-11,hh.y+10);ctx.lineTo(hh.x-6,hh.y-6);ctx.moveTo(hh.x+11,hh.y+10);ctx.lineTo(hh.x+6,hh.y-6);ctx.stroke();}
    else{F('#eef1f4');C(hh.x,hh.y+1,10);F('#ffffff');C(hh.x-4,hh.y-3,3);F('#d8dde3');C(hh.x+5,hh.y+6,3);F('#4a4f5a');C(hh.x,hh.y-10,6);F('#7a8191');C(hh.x-3,hh.y-14,1);F('#f5c542');C(hh.x,hh.y-17,2);C(hh.x+2,hh.y-16,1);F('#ffb347');R(hh.x-4,hh.y-12,8,2);F('#ffd94d');R(hh.x-3,hh.y-12,2,2);F('#c0c8d8');C(hh.x-10,hh.y,2);C(hh.x+10,hh.y,2);R(hh.x-7,hh.y-2,14,6);F('#ffb347');R(hh.x-7,hh.y-2,14,1);F('#14141c');R(hh.x-6,hh.y+1,1,2);R(hh.x+6,hh.y+1,1,2);R(hh.x-5,hh.y-1,9,4);F('#3fe0ff');R(hh.x-4,hh.y,3,3);F('#ff5a5a');C(hh.x+3,hh.y,1);F('#ffd94d');C(hh.x+3,hh.y+2,1);F('#14141c');C(hh.x,hh.y+7,1);}
    F('#fc3');ctx.font='bold 9px monospace';ctx.fillText('LV'+hh.lvl,hh.x-8,hh.y+13);
  }
  for(i=0;i<S.enemies.length;i++){
    var e=S.enemies[i];
    if(e.slowT>0){ctx.strokeStyle='#bfeaff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,7);ctx.stroke();}
    if(e.stunT>0){ctx.strokeStyle='#ffd94d';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,7);ctx.stroke();}
    if(e.rootT>0){ctx.strokeStyle='#b04dff';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,7);ctx.stroke();}
    if(e.burnT>0){ctx.strokeStyle='#ff6a00';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,7);ctx.stroke();}
    F(e.col);
    if(e.type==='swift'){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.PI/4);ctx.fillRect(-6,-6,12,12);ctx.restore();}
    else if(e.type==='tank'){C(e.x,e.y,e.r);F('#222');C(e.x,e.y,5);}
    else R(e.x-e.r,e.y-e.r,e.r*2,e.r*2);
    F('#000');R(e.x-e.r,e.y-e.r-5,e.r*2,3);
    F('#39d353');R(e.x-e.r,e.y-e.r-5,e.r*2*Math.max(0,e.hp/e.mx),3);
  }
  for(i=0;i<S.shots.length;i++){var sh=S.shots[i];if(sh.tw&&sh.tw.type===1){F('#222');C(sh.x,sh.y,5);F('#999');C(sh.x-1,sh.y-1,1);}else{F(sh.col);C(sh.x,sh.y,3);}}
  /* SIEGE CANNON — left edge, aim preview + shells */
  F('#2a1c08');R(SG_MZ.x-10,SG_MZ.y+4,20,10);F('#fc3');C(SG_MZ.x,SG_MZ.y,8);F('#111');C(SG_MZ.x,SG_MZ.y,3);
  ctx.strokeStyle='#fc3';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(SG_MZ.x,SG_MZ.y);ctx.lineTo(SG_MZ.x+Math.cos(S.sgAn*Math.PI/180)*18,SG_MZ.y-Math.sin(S.sgAn*Math.PI/180)*18);ctx.stroke();
  if(S.sgAim&&!S.pz){var a=S.sgAn*Math.PI/180,v=9+S.sgPw*0.08,x=SG_MZ.x,y=SG_MZ.y,vx=Math.cos(a)*v,vy=-Math.sin(a)*v,k;F('#ffd94d');for(k=0;k<48;k++){vy+=SG_G;vx+=S.sgWd*0.02;x+=vx;y+=vy;if(k%4===0)R(x-1,y-1,2,2);if(y>=H||x<0||x>W)break;}}
  for(i=0;i<S.sgPjs.length;i++){var sp=S.sgPjs[i];if(sp.buried){F('#ffd94d');R(sp.x-3,sp.y-6,6,6);F('#ff8800');R(sp.x-1,sp.y-4,2,2);}else{var pr=sp.kind==='sub'?2:4+(S.sgBr-24)/8;F('#ffd94d');C(sp.x,sp.y,pr);F('#ff8800');C(sp.x,sp.y,2);}}
  $('msg').textContent=S.pz?'PAUSED — TAP TO RESUME':(S.msgT>0?S.msg:'');
  $('hc').textContent=S.coins;$('hl').textContent=S.lives;
  $('hw').textContent=S.endless?(''+S.wave):(S.wave+'/'+MAXW);$('hs').textContent=S.score;$('hb').textContent=S.best;
  ctx.restore();
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!S)return;
  if(S.pz){draw();return;}
  var dt=ts-lastTs;lastTs=ts;acc+=Math.min(dt,100);var q=0;
  while(acc>=16.67&&q<4){stepGame(S);acc-=16.67;q++;}
  if(q===4)acc=0;
  if(S.over&&!S.shown){S.shown=true;endGame();}
  if(S.talentQueue.length&&!S.talentOpen&&!S.over){S.talentOpen=true;pg(S,false);showTalent(S.talentQueue[0]);}
  draw();refreshBar();
}
loadLoadout();menu();
requestAnimationFrame(function(ts){lastTs=ts;requestAnimationFrame(loop);});
}
