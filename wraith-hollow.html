<div style="text-align:center;padding:4px 0 6px"><a href="index.html" style="color:#ffd23f;text-decoration:none;font-size:12px">← ARCADE HUB</a></div>
<script>
'use strict';
/* ---- WRAITH WORLD: one shared world across the arcade games. ----
   Key wraith_world_v1 (localStorage, JSON). Every game reads it and
   writes its own marks into it; every game renders the marks other
   games left. Travel between games is a plain same-site page jump, so
   the store carries over. Fresh device = base world (nothing done).
   Namespaced: never touches wraith_pet_v1, wraith_coins,
   wraith_town_upgrades, wraith_dungeon_rooms_<seed>,
   wraith_dungeon_hero. */
var WRAITH_WORLD_KEY='wraith_world_v1';
function worldLoad(){try{var r=localStorage.getItem(WRAITH_WORLD_KEY);if(!r)return{v:1,missions:{},counts:{pet:0,kart:0,delve:0,rooms:0,hollow:0}};var w=JSON.parse(r);if(!w||typeof w!=='object')throw 0;if(!w.missions)w.missions={};if(!w.counts)w.counts={pet:0,kart:0,delve:0,rooms:0,hollow:0};return w;}catch(e){return{v:1,missions:{},counts:{pet:0,kart:0,delve:0,rooms:0,hollow:0}};}}
function worldSave(w){try{localStorage.setItem(WRAITH_WORLD_KEY,JSON.stringify(w));}catch(e){}}
function worldDone(id,game){var w=worldLoad();if(w.missions[id])return false;w.missions[id]=Date.now();if(game)w.counts[game]=(w.counts[game]||0)+1;worldSave(w);return true;}
function worldHas(id){return !!worldLoad().missions[id];}
function worldCount(game){return worldLoad().counts[game]||0;}
function worldMissions(){return worldLoad().missions;}
function worldLine(){var w=worldLoad();return 'WORLD \u2605 PET '+(w.counts.pet||0)+' \u2022 KART '+(w.counts.kart||0)+' \u2022 DELVE '+(w.counts.delve||0)+' \u2022 HOLLOW '+(w.counts.hollow||0)+' \u2022 ROOMS '+(w.counts.rooms||0);}
function toTown(){location.href='kart-race.html';}
function toPet(){location.href='wraith-pet.html';}
function toDelve(){location.href='wraith-dungeon.html';}
/* WRAITH HOLLOW — original stealth dig/craft escape. Small kid, lantern, giant rotting house-ship. No borrowed names, characters, art, music or assets. */
var TW=24,TH=16,TS=20,SAVEKEY='wraith_hollow_v1',WALLETKEY='wraith_coins',PETKEY='wraith_pet_v1',OREKEY='wraith_ore',SEEDKEY='wraith_seeds',BLOCKKEY='wraith_blocks',ROOMKEY='wraith_hollow_rooms_v1';
var MAPSTR=[
"########################",
"#....H......H......H...#",
"#oW.BH.....H...S..Hf.r#",
"#....H......H......H...#",
"###c#.##c###.###c###.###",
"#....H......H......H...#",
"#.f..H..s...H..r...H.c#",
"#....H......H..c...H.S#",
"#..r.H......Hx......H..#",
"##c##.####c#.####c##.###",
"#....H......H......H...#",
"#.x..H..c...H..f..H.r.#",
"#....H......H......H...#",
"##H#c##H###c##.###c#.###",
"#..S..#....r...#..E...#",
"########################"];
var RECIPES=[
 {name:'LANTERN FUEL',cost:{scrap:2},desc:'2 scrap → +60 fuel'},
 {name:'BARRICADE',cost:{wood:2},desc:'2 wood → +1 barricade'},
 {name:'NOISE-MAKER',cost:{scrap:1,cloth:1},desc:'1 scrap + 1 cloth → +1 decoy'},
 {name:'STRONG SHOVEL',cost:{scrap:4,wood:2},desc:'4 scrap + 2 wood → dig 2x faster (kept forever)'}];
var VARIANTS=['SHINY','DARK','DIAMOND'];
function tileAt(S,tx,ty){
  if(tx<0||ty<0||tx>=TW||ty>=TH)return '#';
  return S.grid[ty][tx];
}
function isSolid(S,tx,ty,forHunter){
  var c=tileAt(S,tx,ty);
  if(c==='#'||c==='s'||c==='c')return true;
  if(c==='b')return !!forHunter;
  return false;
}
function losClear(S,x0,y0,x1,y1){
  for(var i=1;i<12;i++){
    var t=i/12,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;
    if(isSolid(S,Math.floor(x),Math.floor(y),true))return false;
  }
  return true;
}
function buildGrid(){
  var g=[];
  for(var y=0;y<TH;y++){
    var row=(MAPSTR[y]||'').padEnd(TW,'#').slice(0,TW).split('');
    g.push(row);
  }
  /* Ladder shafts at cols 5, 12, 19 run the full height so every floor
     is reachable both ways; never overwrites items or special tiles. */
  for(var yy=1;yy<TH-1;yy++){
    var xs=[5,12,19];
    for(var k=0;k<xs.length;k++){
      var cc=g[yy][xs[k]];
      if(cc==='.'||cc==='#')g[yy][xs[k]]='H';
    }
  }
  return g;
}
function findSpawn(S){
  for(var y=0;y<TH;y++)for(var x=0;x<TW;x++)if(S.grid[y][x]==='o')return {x:x,y:y};
  return {x:1,y:1};
}
function walletRead(){
  try{
    var v=localStorage.getItem(WALLETKEY);
    var n=parseFloat(v);
    if(v===null||isNaN(n)||n<0){localStorage.setItem(WALLETKEY,String(50));return 50;}
    return n;
  }catch(e){return 50;}
}
function walletAdd(n){
  try{
    var b=walletRead();
    var v=b+n;
    if(!isFinite(v))v=Math.max(0,b);
    localStorage.setItem(WALLETKEY,String(Math.max(0,v)));
    return Math.max(0,v);
  }catch(e){return 0;}
}

/* BREAK / SPLICE / BUILD resources — ORE, SEEDS and SPLICED BLOCKS share the
   wallet keys Delve uses (wraith_ore/wraith_seeds/wraith_blocks), so the
   resources are shared across games. resRead repairs bad values to 0. */
function resRead(key){try{var v=parseFloat(localStorage.getItem(key));if(isNaN(v)||v<0){localStorage.setItem(key,'0');return 0;}return v;}catch(e){return 0;}}
function resAdd(key,n){try{var b=resRead(key),v=b+n;if(!isFinite(v))v=Math.max(0,b);localStorage.setItem(key,String(Math.max(0,v)));return Math.max(0,v);}catch(e){return 0;}}
function isRichCrack(x,y){return ((x+y)%4)===0;}
/* SAFE-ROOM persistence — Hollow has one fixed map (no seed), so all rooms
   live under one key and are validated against the fresh grid on load. */
function loadRooms(grid){try{var raw=localStorage.getItem(ROOMKEY);if(!raw)return[];var p=JSON.parse(raw);if(!p||!Array.isArray(p.rooms))return[];var out=[];for(var i=0;i<p.rooms.length;i++){var r=p.rooms[i];if(!Array.isArray(r)||r.length<3)continue;var x=r[0]|0,y=r[1]|0,ok=true;if(grid){for(var j=0;j<2&&ok;j++)for(var k=0;k<2&&ok;k++){if(grid[y+j]===undefined||grid[y+j][x+k]!=='.')ok=false;}}if(ok)out.push({x:x,y:y,spliced:!!r[2]});}return out;}catch(e){return[];}}
function saveRooms(rooms){try{localStorage.setItem(ROOMKEY,JSON.stringify({rooms:rooms.map(function(r){return [r.x,r.y,r.spliced?1:0];})}));}catch(e){}}
function inRoom(S,tx,ty){for(var i=0;i<S.rooms.length;i++){var r=S.rooms[i];if(tx>=r.x&&tx<r.x+2&&ty>=r.y&&ty<r.y+2)return r;}return null;}
function playerRoom(S){var c=centerOf(S.p);return inRoom(S,Math.floor(c.x),Math.floor(c.y));}
/* Tuning — reported in the completion notes. */
var DIG_TICKS_C=30,DIG_ORE=2,DIG_ORE_RICH=5,DIG_COIN_CHANCE=1/3,DIG_COIN_AMT=5,SEED_CHANCE=1/4,BUILD_ORE=6,BUILD_COINS=20,SPLICE_SEEDS=3,SPLICE_COINS=5,HEAL_TICKS=60,HEAL_TICKS_SPLICED=30;

function loadSave(){
  var d={shovel:0,best:null,wins:0,sigilsBest:0};
  try{
    var raw=localStorage.getItem(SAVEKEY);
    if(!raw)return d;
    var p=JSON.parse(raw);
    if(p&&typeof p==='object'){
      if(p.shovel)d.shovel=1;
      if(typeof p.best==='number'&&isFinite(p.best))d.best=p.best;
      if(typeof p.wins==='number')d.wins=Math.max(0,Math.floor(p.wins));
      if(typeof p.sigilsBest==='number')d.sigilsBest=Math.max(0,Math.min(3,Math.floor(p.sigilsBest)));
    }
  }catch(e){}
  return d;
}
function saveSave(d){
  try{localStorage.setItem(SAVEKEY,JSON.stringify(d));}catch(e){}
}
function readCameo(){
  var fb={id:'buddy',name:'Buddy',evo:0,variant:null};
  try{
    var raw=localStorage.getItem(PETKEY);
    if(!raw)return fb;
    var p=JSON.parse(raw);
    if(!p||typeof p!=='object'||!p.pets||typeof p.pets!=='object')return fb;
    var id=(typeof p.active==='string'&&p.active)?p.active:'buddy';
    var pet=p.pets[id];
    if(!pet||!pet.owned)return fb;
    var evo=parseInt(pet.evo,10);
    if(isNaN(evo))evo=0;
    evo=Math.max(0,Math.min(2,evo));
    var v=null;
    if(typeof pet.variant==='string'){
      var up=pet.variant.toUpperCase();
      if(VARIANTS.indexOf(up)>=0)v=up;
    }
    var nm=(typeof pet.name==='string'&&pet.name)?pet.name:id;
    return {id:id,name:nm,evo:evo,variant:v};
  }catch(e){return fb;}
}
function emitNoise(S,x,y,r){
  S.noises.push({x:x,y:y,r:r,ttl:30});
}
function centerOf(e){return {x:e.x+e.w/2,y:e.y+e.h/2};}
function ladderAt(S,e){
  var c=centerOf(e);
  return tileAt(S,Math.floor(c.x),Math.floor(c.y))==='H';
}
function moveEnt(S,e,dx,dy,forHunter){
  e.ground=false;
  if(dx!==0){
    e.x+=dx;
    var y0=Math.floor(e.y+0.02),y1=Math.floor(e.y+e.h-0.02);
    for(var ty=y0;ty<=y1;ty++){
      var tx=dx>0?Math.floor(e.x+e.w-0.001):Math.floor(e.x);
      if(isSolid(S,tx,ty,forHunter)||(forHunter&&inRoom(S,tx,ty))){
        if(dx>0)e.x=tx-e.w-0.001;else e.x=tx+1.001;
        e.hitWall=true;break;
      }
    }
  }
  if(dy!==0){
    e.y+=dy;
    var x0=Math.floor(e.x+0.02),x1=Math.floor(e.x+e.w-0.02);
    for(var tx=x0;tx<=x1;tx++){
      var ty=dy>0?Math.floor(e.y+e.h-0.001):Math.floor(e.y);
      if(isSolid(S,tx,ty,forHunter)||(forHunter&&inRoom(S,tx,ty))){
        if(dy>0){e.y=ty-e.h-0.001;e.ground=true;}else e.y=ty+1.001;
        e.vy=0;break;
      }
    }
  }
}
function mkHunter(kind,x,y,x0,x1){
  var h={kind:kind,x:x,y:y,w:0.8,h:1.3,vy:0,dir:1,state:'patrol',stun:0,seekT:0,chaseT:0,tx:x,ty:y,x0:x0,x1:x1,pat:x1,hitWall:false,ground:false};
  if(kind==='warden'){h.w=0.9;h.h=1.5;h.speed=0.045;h.hear=12;h.sight=0;}
  else if(kind==='cook'){h.speed=0.06;h.hear=6;h.sight=5;}
  else{h.speed=0.05;h.hear=8;h.sight=6;}
  return h;
}
function createGame(){
  var S={grid:buildGrid(),ticks:0,bell:1,msg:'',msgT:0,over:false,win:false,paused:false,
    scrap:0,wood:0,cloth:0,rocks:1,barricades:0,decoys:0,digCount:0,ore:0,seeds:0,blocks:0,healT:0,
    sigils:0,hearts:3,hunger:100,fuel:100,starveT:0,invuln:0,walkT:0,
    noises:[],projs:[],rings:[],input:{left:false,right:false,up:false,down:false,sneak:false,jump:false,dig:false,throw:false,decoy:false,build:false,hide:false,splice:false,shelter:false},
    save:loadSave(),cameo:readCameo()};
  var sp=findSpawn(S);
  S.p={x:sp.x,y:sp.y-0.9,w:0.6,h:0.9,vy:0,face:1,hidden:false,digT:0,digTarget:null,digCd:0,climbing:false,ground:false,hitWall:false};
  S.spawn={x:sp.x,y:sp.y-0.9};
  S.hunters=[mkHunter('warden',9,6,6,12),mkHunter('cook',17,6,14,21),mkHunter('cook',7,10,2,10),mkHunter('host',14,13,8,20)];
  S.homes=S.hunters.map(function(h){return {x:h.x,y:h.y};});
  S.rooms=loadRooms(S.grid);
  return S;
}
function setInput(S,patch){
  for(var k in patch)S.input[k]=!!patch[k];
}
function benchNear(S){
  var c=centerOf(S.p);
  for(var y=0;y<TH;y++)for(var x=0;x<TW;x++){
    if(S.grid[y][x]==='B'&&Math.abs(x+0.5-c.x)<=1.6&&Math.abs(y+0.5-c.y)<=1.6)return true;
  }
  return false;
}
function craft(S,idx){
  if(S.over||S.win)return false;
  if(!benchNear(S)){S.msg='FIND THE WORKBENCH';S.msgT=90;return false;}
  var r=RECIPES[idx];
  if(!r)return false;
  if(idx===3&&S.save.shovel){S.msg='SHOVEL ALREADY STRONG';S.msgT=90;return false;}
  for(var k in r.cost){if(S[k]<r.cost[k]){S.msg='NOT ENOUGH MATERIALS';S.msgT=90;return false;}}
  for(var k2 in r.cost)S[k2]-=r.cost[k2];
  if(idx===0)S.fuel=Math.min(100,S.fuel+60);
  else if(idx===1)S.barricades++;
  else if(idx===2)S.decoys++;

    var rm=S.rooms[qi],rx=rm.x*TS,ry=rm.y*TS;
    ctx.fillStyle=rm.spliced?'#2a2a33':'#4a3018';ctx.fillRect(rx,ry,TS*2,TS*2);
    ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.strokeRect(rx+1,ry+1,TS*2-2,TS*2-2);
    ctx.fillStyle=rm.spliced?'#ffd23f':'#ffb84d';ctx.beginPath();ctx.arc(rx+TS,ry+TS,5,0,7);ctx.fill();
    if(rm.spliced){ctx.fillStyle='#ffd23f';ctx.font='12px monospace';ctx.fillText('✦',rx+TS-5,ry+TS+4);}
    ctx.fillStyle='#1a1a20';ctx.fillRect(rx+TS-4,ry+TS*2-10,8,10);
  }
  var cb={x:4*TS,y:2*TS};
  ctx.fillStyle='#39d353';ctx.beginPath();ctx.arc(cb.x+8,cb.y+8,6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.fillText(S.cameo.name.toUpperCase().slice(0,8),cb.x-6,cb.y+24);
  if(S.cameo.variant){ctx.fillStyle='#ffd23f';ctx.fillText(S.cameo.variant,cb.x-6,cb.y+34);}
  for(var ri=0;ri<S.rings.length;ri++){var rg=S.rings[ri];ctx.strokeStyle='#ffd23f';ctx.beginPath();ctx.arc(rg.x*TS,rg.y*TS,8+((rg.ringT%30)/30)*10,0,7);ctx.stroke();}
  for(var pi=0;pi<S.projs.length;pi++){var pr=S.projs[pi];ctx.fillStyle=pr.kind==='rock'?'#c8c8d4':'#ffd23f';ctx.beginPath();ctx.arc(pr.x*TS,pr.y*TS,4,0,7);ctx.fill();}
  for(var hi=0;hi<S.hunters.length;hi++){
    var h=S.hunters[hi],hx=h.x*TS,hy=h.y*TS,hw=h.w*TS,hh=h.h*TS;
    ctx.fillStyle=h.stun>0?'#888':(h.kind==='warden'?'#3a3a55':(h.kind==='cook'?'#5a3a3a':'#223'));
    ctx.fillRect(hx,hy+hh*0.25,hw,hh*0.75);
    ctx.fillRect(hx+hw*0.2,hy,hw*0.6,hh*0.3);
    if(h.kind==='cook'){ctx.fillStyle='#ddd';ctx.fillRect(hx+hw*0.15,hy-5,hw*0.7,6);}
    if(h.kind==='host'){ctx.fillStyle='#e8e8e8';ctx.fillRect(hx+hw*0.2,hy+2,hw*0.6,hh*0.18);}
    ctx.fillStyle='#ff4040';ctx.fillRect(hx+hw*0.25,hy+hh*0.12,3,3);ctx.fillRect(hx+hw*0.6,hy+hh*0.12,3,3);
    if(h.kind==='warden'){ctx.strokeStyle='#3a3a55';ctx.beginPath();ctx.moveTo(hx+2,hy+hh*0.4);ctx.lineTo(hx-8,hy+hh);ctx.moveTo(hx+hw-2,hy+hh*0.4);ctx.lineTo(hx+hw+8,hy+hh);ctx.stroke();}
  }
  var p=S.p;
  if(!p.hidden){
    ctx.strokeStyle='#0a0a12';ctx.lineWidth=2;ctx.strokeRect(p.x*TS+0,p.y*TS+3,18,18);
    ctx.fillStyle='#5a8fd4';ctx.fillRect(p.x*TS+0,p.y*TS+3,18,18);
    ctx.fillStyle='#0a0a12';ctx.beginPath();ctx.arc(p.x*TS+9,p.y*TS+5,7.5,0,7);ctx.fill();
    ctx.fillStyle='#e8c39e';ctx.beginPath();ctx.arc(p.x*TS+9,p.y*TS+5,6.5,0,7);ctx.fill();
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(p.x*TS+15,p.y*TS+8,4,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,210,63,0.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x*TS+9,p.y*TS+12,21,0,7);ctx.stroke();
  }else{
    ctx.fillStyle='#6b6b80';ctx.font='11px monospace';ctx.fillText('HIDING',p.x*TS-4,p.y*TS-4);
  }
  if(p.digT>0){ctx.fillStyle='#ffd23f';ctx.fillRect(p.x*TS,p.y*TS-6,18*(1-p.digT/(p.digMax||40)),3);}
  var pc=centerOf(p);
  var rad=S.fuel>0?210:110;
  var gr=ctx.createRadialGradient(pc.x*TS,pc.y*TS,10,pc.x*TS,pc.y*TS,rad);
  gr.addColorStop(0,'rgba(2,2,12,0)');gr.addColorStop(1,'rgba(2,2,12,0.42)');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(frame%6===0){
    $('hh').textContent=S.hearts;
    $('hhu').textContent=Math.floor(S.hunger);
    $('hfu').textContent=Math.floor(S.fuel);
    $('hsc').textContent=S.scrap;
    $('hwo').textContent=S.wood;
    $('hcl').textContent=S.cloth;
    $('hrk').textContent=S.rocks;
    $('hsg').textContent=S.sigils+'/3';
    $('hco').textContent=Math.floor(walletRead());
    $('hor').textContent=Math.floor(resRead(OREKEY));
    $('hse').textContent=Math.floor(resRead(SEEDKEY));
    $('hbl').textContent=Math.floor(resRead(BLOCKKEY));
    $('hco2').textContent=Math.floor(walletRead());
    $('hro').textContent=S.rooms.length;
    var shb=$('bshelter');if(shb)shb.textContent=resRead(BLOCKKEY)>=1?'🏠 BUILD SPLICED':'🏠 SHELTER';
    $('hbe').textContent=ROMAN[Math.min(7,S.bell-1)];
    if(S.msgT>0)$('msg').textContent=S.msg;else $('msg').textContent='';
  }
  frame++;
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!playing||paused||craftOpen)return;
  var dt=Math.min(50,ts-(lastTs||ts));lastTs=ts;
  stepGame(S);
  draw();
  endCheck();
}
function bindHold(id,down,up){
  var el=$(id);if(!el)return;
  var on=function(e){e.preventDefault();down();},off=function(e){e.preventDefault();if(up)up();};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);
}
bindHold('bl',function(){S.input.left=true;},function(){S.input.left=false;});
bindHold('br',function(){S.input.right=true;},function(){S.input.right=false;});
bindHold('bu',function(){S.input.up=true;},function(){S.input.up=false;});
bindHold('bd',function(){S.input.down=true;},function(){S.input.down=false;});
bindHold('bjump',function(){S.input.jump=true;});
bindHold('bdig',function(){S.input.dig=true;});
bindHold('bthrow',function(){S.input.throw=true;});
bindHold('bdecoy',function(){S.input.decoy=true;});
bindHold('bhide',function(){S.input.hide=true;});
bindHold('bbuild',function(){S.input.build=true;});
bindHold('bsneak',function(){S.input.sneak=!S.input.sneak;$('bsneak').style.background=S.input.sneak?'#333':'';});
bindHold('bsplice',function(){S.input.splice=true;});
bindHold('bshelter',function(){S.input.shelter=true;});
/* RETRO PAD: additive touch controls reusing bindHold and the same S.input fields as the hold-buttons and keyboard. */
bindHold('rpad-left',function(){S.input.left=true;},function(){S.input.left=false;});
bindHold('rpad-right',function(){S.input.right=true;},function(){S.input.right=false;});
bindHold('rpad-up',function(){S.input.up=true;},function(){S.input.up=false;});
bindHold('rpad-down',function(){S.input.down=true;},function(){S.input.down=false;});
bindHold('rpad-a',function(){S.input.throw=true;});
bindHold('rpad-b',function(){S.input.sneak=true;},function(){S.input.sneak=false;});
/* CENTER JOYSTICK: drag the nub in the D-pad's center cell to move — same
   S.input fields as the arrow buttons (left/right/up/down, diagonals set
   both). The four arrows on the base are static direction markers, not
   buttons. Release (or cancel) recenters the nub and clears the inputs. */
(function(){
var joy=$('rpad-joy'),nub=$('rpad-joy-nub');
if(!joy||!nub)return;
var joyId=null,joyR=14;
function joySet(dx,dy){
var nx=dx/joyR,ny=dy/joyR;
S.input.left=nx<-0.3;S.input.right=nx>0.3;S.input.up=ny<-0.3;S.input.down=ny>0.3;
}
function joyReset(){joyId=null;if(nub)nub.style.transform='';S.input.left=false;S.input.right=false;S.input.up=false;S.input.down=false;}
function joyMove(e){
if(joyId===null||e.pointerId!==joyId)return;
var r=joy.getBoundingClientRect();
var dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
var m=Math.hypot(dx,dy);
if(m>joyR){dx*=joyR/m;dy*=joyR/m;}
nub.style.transform='translate('+dx+'px,'+dy+'px)';
joySet(dx,dy);
}
joy.addEventListener('pointerdown',function(e){
e.preventDefault();
joyId=e.pointerId;
try{joy.setPointerCapture(e.pointerId);}catch(err){}
joyMove(e);
});
joy.addEventListener('pointermove',joyMove);
joy.addEventListener('pointerup',function(e){if(e.pointerId===joyId)joyReset();});
joy.addEventListener('pointercancel',function(e){if(e.pointerId===joyId)joyReset();});
})();
$('bcraft').addEventListener('click',function(){
  if(!playing||!benchNear(S)){S.msg='FIND THE WORKBENCH';S.msgT=90;return;}
  craftOpen=true;refreshCraft();$('craft').style.display='flex';
});
function refreshCraft(){
  $('crp').textContent='SCRAP '+S.scrap+' · WOOD '+S.wood+' · CLOTH '+S.cloth+' · SHOVEL '+(S.save.shovel?'STRONG':'PLAIN');
  for(var i=0;i<4;i++){
    var b=$('cr'+i),r=RECIPES[i],ok=true;
    for(var k in r.cost)if(S[k]<r.cost[k])ok=false;
    if(i===3&&S.save.shovel)ok=false;
    b.textContent=(i+1)+'. '+r.name+' — '+r.desc;
    b.disabled=!ok;
  }
}
for(var ci=0;ci<4;ci++)(function(i){
  $('cr'+i).addEventListener('click',function(){craft(S,i);refreshCraft();});
})(ci);
$('crx').addEventListener('click',function(){craftOpen=false;$('craft').style.display='none';});
$('bp').addEventListener('click',function(){
  if(!playing)return;
  paused=!paused;
  $('bp').textContent=paused?'▶ RESUME':'❚❚ PAUSE';
  showOv(paused?'PAUSED':'','',paused?'<button onclick="document.getElementById(\'bp\').click()">RESUME</button>':'');
  if(!paused)hideOv();
});
document.addEventListener('keydown',function(e){
  if(e.repeat)return;
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')S.input.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')S.input.right=true;
  else if(k==='ArrowUp'||k==='w'||k==='W')S.input.up=true;
  else if(k==='ArrowDown'||k==='s'||k==='S')S.input.down=true;
  else if(k===' '){S.input.jump=true;e.preventDefault();}
  else if(k==='Shift')S.input.sneak=true;
  else if(k==='D')S.input.dig=true;
  else if(k==='T')S.input.throw=true;
  else if(k==='N')S.input.decoy=true;
  else if(k==='H')S.input.hide=true;
  else if(k==='B')S.input.build=true;
  else if(k==='v'||k==='V')S.input.splice=true;
  else if(k==='x'||k==='X')S.input.shelter=true;
  else if(k==='C'&&playing&&benchNear(S)){craftOpen=true;refreshCraft();$('craft').style.display='flex';}
  else if(k==='Escape'&&craftOpen){craftOpen=false;$('craft').style.display='none';}
  else if(k==='1'&&craftOpen)craft(S,0);
  else if(k==='2'&&craftOpen)craft(S,1);
  else if(k==='3'&&craftOpen)craft(S,2);
  else if(k==='4'&&craftOpen)craft(S,3);
});
document.addEventListener('keyup',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')S.input.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')S.input.right=false;
  else if(k==='ArrowUp'||k==='w'||k==='W')S.input.up=false;
  else if(k==='ArrowDown'||k==='s'||k==='S')S.input.down=false;
  else if(k==='Shift')S.input.sneak=false;
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&playing&&!S.over&&!S.win){paused=true;$('bp').textContent='▶ RESUME';showOv('PAUSED','The Hollow waits.','<button onclick="document.getElementById(\'bp\').click()">RESUME</button>');}
});
var menuRooms=loadRooms().length;
showOv('WRAITH HOLLOW','A small kid. A lantern. A giant rotting house-ship.<br>Dig soft earth. Craft at the workbench. Hide from the Warden, the Cooks, and the Host.<br>Find 3 sigils. Reach the gold door.<br><br>MOVE arrows/WASD · JUMP space · DIG D · THROW T · DECOY N · HIDE H · BUILD B · CRAFT C · SNEAK shift<br>⛏ BREAK cracked walls for ORE · SEEDS · MOLECULES — SPLICE 3 seeds + 5 molecules into a block (V) — BUILD a shelter, 6 ore + 20 molecules (X): monsters cannot enter, you heal inside.'+(menuRooms>0?'<br>🏠 '+menuRooms+' SAFE ROOM(S) BUILT — WAITING FOR YOU':'')+'<br>'+worldLine() ,'<button onclick="window.__hwStart()">ENTER THE HOLLOW</button><button onclick="toTown()">🏙 WRAITH TOWN</button><button onclick="toPet()">🏠 PET WORLD</button><button onclick="toDelve()">⚔ DELVE</button>');
draw();
requestAnimationFrame(loop);
}
