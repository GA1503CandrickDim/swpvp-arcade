<script>
'use strict';
/* HOLLOW DELVE — original merge of the kid-and-lantern stealth house and the top-down dungeon delve. Room by room: clear, loot, descend. No borrowed names, characters, art, music or assets. */
var TW=36,TH=24,TS=24,WW=TW*TS,WH=TH*TS,VW=480,VH=270;
var SAVEKEY='wraith_mix_v1',WALLETKEY='wraith_coins',PETKEY='wraith_pet_v1';
var VARIANTS=['SHINY','DARK','DIAMOND'];
var WEAPONS=[
 {id:'blade',name:'RUSTED BLADE',dmg:1,range:36,cd:20},
 {id:'brand',name:'EMBER BRAND',dmg:1,range:36,cd:20,burn:90},
 {id:'bow',name:'SCRAP BOW',dmg:2,range:130,cd:30,proj:true}];
var RECIPES=[
 {name:'LANTERN FUEL',cost:{scrap:2},desc:'2 scrap → +60 fuel'},
 {name:'BARRICADE',cost:{wood:2},desc:'2 wood → +1 barricade'},
 {name:'NOISE-MAKER',cost:{scrap:1,cloth:1},desc:'1 scrap + 1 cloth → +1 decoy'},
 {name:'STRONG SHOVEL',cost:{scrap:4,wood:2},desc:'4 scrap + 2 wood → dig 2x faster (kept forever)'}];
function rng32(s){var a=s>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashSeed(seed,floor){return (seed*7919+floor*104729+13)>>>0;}
function roomAt(rooms,tx,ty){
  for(var i=0;i<rooms.length;i++){var q=rooms[i];if(tx>=q.x&&tx<q.x+q.w&&ty>=q.y&&ty<q.y+q.h)return i;}
  return -1;
}
function genFloor(seed,floor){
  var r=rng32(hashSeed(seed,floor));
  var g=new Array(TW*TH),i;for(i=0;i<g.length;i++)g[i]=1;
  var rooms=[],tries=0,n=Math.min(5+floor,9);
  while(rooms.length<n&&tries<300){tries++;
    var w=5+((r()*5)|0),h=4+((r()*4)|0);
    var x=1+((r()*(TW-w-2))|0),y=1+((r()*(TH-h-2))|0),ok=true;
    for(i=0;i<rooms.length;i++){var q=rooms[i];if(x<q.x+q.w+1&&x+w+1>q.x&&y<q.y+q.h+1&&y+h+1>q.y){ok=false;break;}}
    if(!ok)continue;
    rooms.push({x:x,y:y,w:w,h:h,cx:x+(w>>1),cy:y+(h>>1)});
  }
  for(i=0;i<rooms.length;i++){var q2=rooms[i];for(var y=q2.y;y<q2.y+q2.h;y++)for(var x2=q2.x;x2<q2.x+q2.w;x2++)g[y*TW+x2]=0;}
  var paths=[];
  for(i=1;i<rooms.length;i++){var a=rooms[i-1],b=rooms[i],cx=a.cx,cy=a.cy,path=[];
    while(cx!==b.cx){g[cy*TW+cx]=0;path.push({x:cx,y:cy});cx+=cx<b.cx?1:-1;}
    while(cy!==b.cy){g[cy*TW+cx]=0;path.push({x:cx,y:cy});cy+=cy<b.cy?1:-1;}
    g[cy*TW+cx]=0;path.push({x:cx,y:cy});
    paths.push(path);
  }
  var doors=[];
  for(i=1;i<rooms.length;i++){
    var cand=[];
    for(var k=0;k<paths[i-1].length;k++){var t=paths[i-1][k];if(roomAt(rooms,t.x,t.y)<0)cand.push(t);}
    if(cand.length)doors.push({tx:cand[cand.length>>1].x,ty:cand[cand.length>>1].y,room:i,open:false});
  }
  var start=rooms[0],far=rooms[0],fd=-1;
  for(i=0;i<rooms.length;i++){var q3=rooms[i],d=(q3.cx-start.cx)*(q3.cx-start.cx)+(q3.cy-start.cy)*(q3.cy-start.cy);if(d>fd){fd=d;far=q3;}}
  var feat=new Array(TW*TH);
  for(i=0;i<feat.length;i++)feat[i]='.';
  function featSet(tx,ty,c){if(tx>0&&ty>0&&tx<TW-1&&ty<TH-1)feat[ty*TW+tx]=c;}
  function freeTile(q){
    for(var t=0;t<40;t++){var tx=q.x+1+((r()*Math.max(1,q.w-2))|0),ty=q.y+1+((r()*Math.max(1,q.h-2))|0);
      if(feat[ty*TW+tx]==='.'&&!(tx===q.cx&&ty===q.cy))return {tx:tx,ty:ty};}
    for(var sy=q.y+1;sy<q.y+q.h-1;sy++)for(var sx=q.x+1;sx<q.x+q.w-1;sx++){
      if(feat[sy*TW+sx]==='.'&&!(sx===q.cx&&sy===q.cy))return {tx:sx,ty:sy};}
    return null;
  }
  var weaponAt={};
  var st=freeTile(far);
  if(st)featSet(st.tx,st.ty,'S');
  var et={tx:far.cx,ty:far.cy};
  if(feat[et.ty*TW+et.tx]!=='.')et=freeTile(far);
  if(et)featSet(et.tx,et.ty,'E');
  if(!st)st={tx:et.tx,ty:et.ty};
  if(!et)et={tx:st.tx,ty:st.ty};
  for(i=1;i<rooms.length;i++){
    var q=rooms[i];
    var s1=freeTile(q);if(s1)featSet(s1.tx,s1.ty,'s');
    var s2=freeTile(q);if(s2)featSet(s2.tx,s2.ty,'s');
    var c1=freeTile(q);if(c1)featSet(c1.tx,c1.ty,'c');
    var w1=freeTile(q);if(w1)featSet(w1.tx,w1.ty,'W');
    if(r()<0.6){var f1=freeTile(q);if(f1)featSet(f1.tx,f1.ty,'f');}
    if(r()<0.5){var r1=freeTile(q);if(r1)featSet(r1.tx,r1.ty,'r');}
  }
  var bq=rooms[(r()*rooms.length)|0];var bt=freeTile(bq);if(bt)featSet(bt.tx,bt.ty,'B');
  var xq=rooms[(r()*rooms.length)|0];var xt=freeTile(xq);if(xt)featSet(xt.tx,xt.ty,'x');
  var wq=rooms[1+((r()*Math.max(1,rooms.length-1))|0)]||rooms[0];
  var wt=freeTile(wq);
  if(wt){featSet(wt.tx,wt.ty,'P');weaponAt[wt.tx+','+wt.ty]=WEAPONS[(r()*WEAPONS.length)|0].id;}
  return {grid:g,feat:feat,rooms:rooms,doors:doors,start:start,stairs:{tx:et.tx,ty:et.ty},sigil:{tx:st.tx,ty:st.ty},weaponAt:weaponAt,rng:r};
}
function walletRead(){
  try{
    var v=localStorage.getItem(WALLETKEY);
    var n=parseFloat(v);
    if(v===null||isNaN(n)||n<0){localStorage.setItem(WALLETKEY,String(50));return 50;}
    return n;
  }catch(e){return 50;}
}
function walletAdd(n){
  try{
    var b=walletRead();
    var v=b+n;
    if(!isFinite(v))v=Math.max(0,b);
    localStorage.setItem(WALLETKEY,String(Math.max(0,v)));
    return Math.max(0,v);
  }catch(e){return 0;}
}
function loadSave(){
  var d={shovel:0,best:null,wins:0,sigilsBest:0};
  try{
    var raw=localStorage.getItem(SAVEKEY);
    if(!raw)return d;
    var p=JSON.parse(raw);
    if(p&&typeof p==='object'){
      if(p.shovel)d.shovel=1;
      if(p.best&&typeof p.best==='object')d.best={floor:Math.max(0,Math.floor(p.best.floor||0)),score:Math.max(0,Math.floor(p.best.score||0))};
      if(typeof p.wins==='number')d.wins=Math.max(0,Math.floor(p.wins));
      if(typeof p.sigilsBest==='number')d.sigilsBest=Math.max(0,Math.floor(p.sigilsBest));
    }
  }catch(e){}
  return d;
}
function saveSave(d){
  try{localStorage.setItem(SAVEKEY,JSON.stringify(d));}catch(e){}
}
function saveBest(floor,score){
  var d=loadSave();
  if(!d.best||floor>d.best.floor||(floor===d.best.floor&&score>d.best.score))d.best={floor:floor,score:score};
  saveSave(d);
  return d.best||{floor:floor,score:score};
}
function readCameo(){
  var fb={id:'buddy',name:'Buddy',evo:0,variant:null};
  try{
    var raw=localStorage.getItem(PETKEY);
    if(!raw)return fb;
    var p=JSON.parse(raw);
    if(!p||typeof p!=='object'||!p.pets||typeof p.pets!=='object')return fb;
    var id=(typeof p.active==='string'&&p.active)?p.active:'buddy';
    var pet=p.pets[id];
    if(!pet||!pet.owned)return fb;
    var evo=parseInt(pet.evo,10);
    if(isNaN(evo))evo=0;
    evo=Math.max(0,Math.min(2,evo));
    var v=null;
    if(typeof pet.variant==='string'){
      var up=pet.variant.toUpperCase();
      if(VARIANTS.indexOf(up)>=0)v=up;
    }
    var nm=(typeof pet.name==='string'&&pet.name)?pet.name:id;
    return {id:id,name:nm,evo:evo,variant:v};
  }catch(e){return fb;}
}
function featAt(S,tx,ty){
  if(tx<0||ty<0||tx>=TW||ty>=TH)return '#';
  return S.feat[ty*TW+tx];
}
function doorAt(S,tx,ty){
  for(var i=0;i<S.doors.length;i++){var d=S.doors[i];if(d.tx===tx&&d.ty===ty)return d;}
  return null;
}
function wallAt(S,tx,ty){
  if(tx<0||ty<0||tx>=TW||ty>=TH)return 1;
  return S.grid[ty*TW+tx];
}
function solidAt(S,tx,ty,forHunter){
  if(wallAt(S,tx,ty))return true;
  var f=featAt(S,tx,ty);
  if(f==='s'||f==='c')return true;
  if(f==='b')return !!forHunter;
  var d=doorAt(S,tx,ty);
  if(d&&!d.open)return true;
  return false;
}
function hitsWall(S,x,y,w,h,forHunter){
  var x0=Math.floor(x/TS),x1=Math.floor((x+w-1)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-1)/TS);
  for(var ty=y0;ty<=y1;ty++)for(var tx=x0;tx<=x1;tx++)if(solidAt(S,tx,ty,forHunter))return true;
  return false;
}
function moveE(S,e,dx,dy,forHunter){
  if(dx!==0){var nx=e.x+dx;if(!hitsWall(S,nx,e.y,e.w,e.h,forHunter))e.x=nx;}
  if(dy!==0){var ny=e.y+dy;if(!hitsWall(S,e.x,ny,e.w,e.h,forHunter))e.y=ny;}
}
function losClear(S,x0,y0,x1,y1){
  for(var i=1;i<12;i++){
    var t=i/12,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;
    if(solidAt(S,Math.floor(x/TS),Math.floor(y/TS),false))return false;
  }
  return true;
}
function centerOf(e){return {x:e.x+e.w/2,y:e.y+e.h/2};}
function emitNoise(S,x,y,r){S.noises.push({x:x,y:y,r:r,ttl:30});}
function bellMult(bell){return Math.min(2,1+0.15*(bell-1));}
function mkHunter(kind,x,y,room){
  var q={x:x,y:y,w:16,h:20,vy:0,dir:1,state:'patrol',stun:0,seekT:0,chaseT:0,tx:x,ty:y,room:room,kind:kind,hp:kind==='host'?6:4,maxHp:kind==='host'?6:4,dmg:2,score:60,anim:0};
  if(kind==='warden'){q.speed=1.0;q.sight=0;q.hear=1.5;}
  else if(kind==='cook'){q.speed=1.3;q.sight=5;q.hear=1;}
  else{q.speed=1.15;q.sight=6;q.hear=1;}
  return q;
}
function spawnFloorEnemies(S,gen){
  var r=gen.rng;
  S.monsters=[];S.hunters=[];S.boss=null;
  var bossFloor=(S.floor%3===0);
  var farIdx=roomAt(gen.rooms,gen.stairs.tx,gen.stairs.ty);
  for(var i=1;i<gen.rooms.length;i++){
    var q=gen.rooms[i];
    var cnt=1+((r()<0.5+Math.min(0.3,0.06*(S.floor-1)))?1:0);
    if(S.floor>=3)cnt++;
    if(i===farIdx&&bossFloor)cnt=Math.max(1,cnt-1);
    for(var k=0;k<cnt;k++){
      var tx=q.x+1+((r()*Math.max(1,q.w-2))|0),ty=q.y+1+((r()*Math.max(1,q.h-2))|0);
      var hulk=r()<0.35;
      var hp=hulk?7+((S.floor/3)|0):3+((S.floor/4)|0);
      S.monsters.push({x:tx*TS+5,y:ty*TS+5,w:14,h:14,hulk:hulk,hp:hp,maxHp:hp,room:i,
        sp:(hulk?0.35:0.7)*(1+Math.min(0.6,0.08*(S.floor-1))),dmg:hulk?2:1,score:hulk?50:20,
        wind:0,cd:0,wx:0,wy:0,wt:0,anim:0,burn:0,burnT:0});
    }
  }
  var mid=gen.rooms[Math.max(1,(gen.rooms.length>>1))];
  S.hunters.push(mkHunter('warden',mid.cx*TS+4,mid.cy*TS+4,roomAt(gen.rooms,mid.cx,mid.cy)));
  if(gen.rooms.length>2){
    var mid2=gen.rooms[gen.rooms.length-2];
    if(mid2!==mid)S.hunters.push(mkHunter('cook',mid2.cx*TS+4,mid2.cy*TS+4,roomAt(gen.rooms,mid2.cx,mid2.cy)));
  }
  if(S.floor>=2){
    var hr=gen.rooms[1+((r()*Math.max(1,gen.rooms.length-1))|0)]||gen.rooms[0];
    S.hunters.push(mkHunter('host',hr.cx*TS+4,hr.cy*TS+4,roomAt(gen.rooms,hr.cx,hr.cy)));
  }
  for(var h=0;h<S.hunters.length;h++){
    var hh=S.hunters[h],qr=gen.rooms[hh.room]||gen.rooms[0];
    hh.x0=qr.x*TS+4;hh.x1=(qr.x+qr.w)*TS-20;hh.pat=hh.x1;
  }
  if(bossFloor){
    var bq=gen.rooms[farIdx];
    var bhp=30+5*S.floor;
    S.boss={x:bq.cx*TS+2,y:bq.cy*TS,w:22,h:22,hulk:true,boss:true,hp:bhp,maxHp:bhp,room:farIdx,
      sp:0.5,dmg:3,score:200,wind:0,cd:0,wx:0,wy:0,wt:0,anim:0,burn:0,burnT:0,sumT:240,minions:0};
  }
}
function loadFloor(S){
  var gen=genFloor(S.seed,S.floor);
  S.grid=gen.grid;S.feat=gen.feat;S.rooms=gen.rooms;S.doors=gen.doors;
  S.stairs=gen.stairs;S.sigilTile=gen.sigil;S.weaponAt=gen.weaponAt;
  S.rng=rng32((S.seed^(S.floor*2654435761))>>>0);

  if(frame%6===0){
    $('hf').textContent=S.floor;
    $('hh').textContent=Math.max(0,S.hp);
    $('hhu').textContent=Math.floor(S.hunger);
    $('hfu').textContent=Math.floor(S.fuel);
    $('hsc').textContent=S.scrap;
    $('hwo').textContent=S.wood;
    $('hcl').textContent=S.cloth;
    $('hrk').textContent=S.rocks;
    $('hsg').textContent=S.sigilsRun;
    $('hco').textContent=Math.floor(walletRead());
    $('hbe').textContent=ROMAN[Math.min(7,S.bell-1)];
    $('hseed').textContent=S.seed;
    $('hwp').textContent=S.weapon.name;
    $('hs').textContent=S.score;
    $('hb').textContent=S.best?S.best.score:0;
    if(S.msgT>0)$('msg').textContent=S.msg;else $('msg').textContent='';
  }
  frame++;
}
function loop(ts){
  requestAnimationFrame(loop);
  if(!S)return;
  if(paused){$('msg').textContent='PAUSED — TAP TO RESUME';draw();return;}
  var dt=ts-lastTs;lastTs=ts;if(tsReset){dt=0;tsReset=false;}acc+=Math.min(dt,100);
  var steps=0;
  while(acc>=16.67&&steps<4){
    var inp={left:!!keys.left,right:!!keys.right,up:!!keys.up,down:!!keys.down,
      atk:!!edges.atk,dig:!!edges.dig,throw:!!edges.throw,decoy:!!edges.decoy,
      build:!!edges.build,hide:!!edges.hide,sneak:!!keys.sneak};
    edges={};
    stepRun(S,inp);
    acc-=16.67;steps++;
    if(S.phase==='over'||S.phase==='won')break;
  }
  if(steps===4)acc=0;
  if(S.phase==='over'||S.phase==='won'){draw();endCheck();return;}
  draw();
}
renderMenu();
requestAnimationFrame(function(ts){lastTs=ts;requestAnimationFrame(loop);});
}
</script>
